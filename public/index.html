<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1C2333; --navy2:#252E45; --amber:#F5A623; --amber-d:#8A5A0A;
    --green:#2FA84F; --green-bg:#E7F6EC; --green-d:#1E6B33;
    --red:#E5484D; --red-bg:#FDEAEA; --red-d:#9A1F23;
    --gray:#6B7280; --line:#E3E4E8; --bg:#F4F5F7; --card:#FFFFFF;
    --text:#1C2333; --text2:#6B7280;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);}
  h1,h2,h3{font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:600;letter-spacing:.01em;margin:0;}
  .app{max-width:1180px;margin:0 auto;padding:20px;}
  .login-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;}
  .login-card{background:var(--navy);color:#fff;border-radius:14px;padding:36px 40px;width:400px;max-width:92vw;}
  .login-card h1{font-size:28px;color:var(--amber);margin-bottom:4px;}
  .login-sub{color:#B9BFD1;font-size:13px;margin-bottom:24px;}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
  .role-btn{background:var(--navy2);border:1px solid #3A4358;color:#fff;border-radius:9px;padding:14px 10px;cursor:pointer;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:17px;transition:.15s;}
  .role-btn:hover{border-color:var(--amber);}
  .role-btn.active{background:var(--amber);color:#2A1D00;border-color:var(--amber);}
  .role-btn small{display:block;font-family:'Inter',sans-serif;font-size:11px;color:#B9BFD1;font-weight:400;margin-top:2px;}
  .role-btn.active small{color:#5A3E00;}
  .building-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:0 0 12px;}
  .building-btn{padding:9px;border:1px solid #3A4358;border-radius:7px;background:var(--navy2);color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
  .building-btn:hover{border-color:var(--amber);}
  .building-btn.active{background:var(--amber);border-color:var(--amber);color:#2A1D00;}
  .login-card input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid #3A4358;background:#141928;color:#fff;font-size:14px;margin-bottom:10px;}
  .login-card button.go{width:100%;background:var(--amber);color:#2A1D00;border:none;padding:12px;border-radius:8px;font-weight:600;font-size:15px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;letter-spacing:.03em;}
  .login-err{color:#FFB4B4;font-size:12.5px;margin:-4px 0 10px;}
  .view-only-link{display:block;text-align:center;color:#8B93A8;font-size:12.5px;margin-top:16px;cursor:pointer;text-decoration:underline;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .badge{width:38px;height:38px;background:var(--navy);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--amber);font-family:'Barlow Condensed';font-size:20px;font-weight:700;}
  .brand h1{font-size:22px;}
  .brand .sub{font-size:12px;color:var(--text2);}
  .who{display:flex;align-items:center;gap:12px;}
  .who .tag{background:var(--navy);color:var(--amber);padding:6px 14px;border-radius:20px;font-family:'Barlow Condensed';font-size:15px;font-weight:600;}
  .who button{background:none;border:1px solid var(--line);border-radius:7px;padding:7px 12px;font-size:12.5px;cursor:pointer;color:var(--text2);}
  .who button:hover{border-color:var(--gray);}
  .tabs{display:flex;gap:6px;margin-bottom:20px;}
  .tab{padding:9px 18px;border-radius:8px;cursor:pointer;font-family:'Barlow Condensed';font-size:16px;font-weight:600;color:var(--text2);}
  .tab.active{background:var(--navy);color:#fff;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:22px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .card .num{font-family:'Barlow Condensed';font-size:32px;font-weight:700;line-height:1;}
  .card .lbl{font-size:12px;color:var(--text2);margin-top:6px;}
  .card.warn .num{color:var(--red);}
  .section-title{font-size:16px;margin:22px 0 10px;color:var(--navy);border-left:4px solid var(--amber);padding-left:10px;}
  .alert-list{background:var(--red-bg);border:1px solid #F3B7B8;border-radius:10px;padding:4px 14px;}
  .alert-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F3B7B8;font-size:13.5px;}
  .alert-row:last-child{border-bottom:none;}
  .alert-row .spk{font-weight:600;color:var(--red-d);}
  .toolbar{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap;}
  .toolbar input[type=text]{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;min-width:180px;}
  .component-filter{display:flex;align-items:center;gap:8px;color:var(--text2);}
  .component-filter span{font-size:12px;font-weight:600;}
  .component-filter select{min-height:38px;padding:8px 30px 8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--text);font-size:13px;}
  .component-filter{position:relative;display:block;}
  .component-filter summary{display:flex;align-items:center;gap:10px;min-height:38px;padding:7px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--text);font-size:12px;cursor:pointer;list-style:none;}
  .component-filter summary::-webkit-details-marker{display:none;}
  .component-filter summary::after{content:'';width:7px;height:7px;margin-left:2px;border-right:1.5px solid var(--text2);border-bottom:1.5px solid var(--text2);transform:rotate(45deg) translateY(-2px);}
  .component-filter summary span{color:var(--text2);}
  .component-filter summary strong{font-size:12px;font-weight:600;}
  .component-filter-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:20;min-width:200px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-md);}
  .component-filter-menu label{display:flex;align-items:center;gap:9px;padding:8px;border-radius:5px;color:var(--text);font-size:12px;cursor:pointer;}
  .component-filter-menu label:hover{background:#F3F6F2;}
  .component-filter-menu input{margin:0;accent-color:var(--green);}
  .btn{background:var(--navy);color:#fff;border:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-family:'Barlow Condensed';font-size:15px;font-weight:600;}
  .btn.amber{background:var(--amber);color:#2A1D00;}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--text);}
  .btn.sm{padding:6px 12px;font-size:13px;border-radius:6px;}
  .btn.danger{background:var(--red);color:#fff;}
  .add-form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;display:none;}
  .add-form.open{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end;}
  .add-form label{font-size:11.5px;color:var(--text2);display:block;margin-bottom:4px;}
  .add-form input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;}
  .item-card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;}
  .item-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;gap:10px;flex-wrap:wrap;}
  .item-head .spk{font-family:'Barlow Condensed';font-size:19px;font-weight:700;color:var(--navy);}
  .item-head .meta{font-size:12px;color:var(--text2);margin-top:2px;}
  .item-head .overdue{color:var(--red-d);font-weight:600;}
  .stages-mini{display:flex;gap:6px;flex-wrap:wrap;}
  .stat-pill{padding:5px 11px;border-radius:20px;font-size:11.5px;font-weight:600;font-family:'Inter';display:flex;align-items:center;gap:5px;white-space:nowrap;}
  .stat-pill.ok{background:var(--green-bg);color:var(--green-d);}
  .stat-pill.partial{background:#FEF3DE;color:var(--amber-d);}
  .stat-pill.pending{background:#EFEFF1;color:var(--text2);}
  .stat-pill.hasret{background:var(--red-bg);color:var(--red-d);}
  .item-body{border-top:1px solid var(--line);padding:16px;display:none;background:#FAFAFB;}
  .item-body.open{display:block;}
  .stage-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:760px){.stage-grid{grid-template-columns:1fr;}.add-form.open{grid-template-columns:1fr;}}
  .stage-box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .stage-box h4{font-size:14px;margin-bottom:2px;}
  .stage-box .zh{color:var(--text2);font-weight:400;font-size:12px;}
  .progress-track{background:#EDEDEF;border-radius:6px;height:8px;margin:8px 0;overflow:hidden;}
  .progress-fill{background:var(--green);height:100%;}
  .progress-fill.partial{background:var(--amber);}
  .hist-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);padding:3px 0;border-bottom:1px dashed #EAEAEC;}
  .hist-row:last-child{border-bottom:none;}
  .inline-form{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .inline-form input{flex:1;padding:7px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;min-width:70px;}
  .locked{color:var(--text2);font-size:12px;font-style:italic;padding:6px 0;}
  .ret-item{background:var(--red-bg);border:1px solid #F3B7B8;border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:12.5px;}
  .ret-item .top{display:flex;justify-content:space-between;font-weight:600;color:var(--red-d);}
  .ret-item .meta{color:var(--text2);margin-top:2px;}
  .empty{text-align:center;color:var(--text2);padding:40px 10px;font-size:13.5px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:50;}
  /* Summary cards */
  .summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:24px;}
  .scard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;}
  .scard .num{font-family:'Barlow Condensed';font-size:28px;font-weight:700;line-height:1;}
  .scard .lbl{font-size:11px;color:var(--text2);margin-top:4px;line-height:1.4;}
  .scard.warn .num{color:var(--red);}
  .scard.good .num{color:var(--green);}
  /* Kanban */
  .pipeline-title{font-size:15px;font-weight:600;color:var(--navy);margin-bottom:12px;padding-left:12px;border-left:4px solid var(--amber);}
  .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start;}
  @media(max-width:900px){.kanban{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:500px){.kanban{grid-template-columns:1fr;}}
  .kcol{background:#EDEDEF;border-radius:12px;padding:10px;border-top:3px solid #C5C7CC;}
  .kcol-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .kcol-title{font-family:'Barlow Condensed';font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;}
  .kcol-zh{font-family:'Inter';font-weight:400;color:var(--text2);font-size:11px;display:block;margin-top:1px;}
  .kcol-badge{border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700;}
  .col-antrian{border-top-color:#64748B;}
  .col-whparsial{border-top-color:var(--amber);}
  .col-whok{border-top-color:#2563EB;}
  .col-selesai{border-top-color:var(--red);}
  .col-antrian .kcol-badge{background:var(--navy);color:#fff;}
  .col-whparsial .kcol-badge{background:#FEF3DE;color:var(--amber-d);}
  .col-whok .kcol-badge{background:#DBEAFE;color:#1E40AF;}
  .col-selesai .kcol-badge{background:var(--red-bg);color:var(--red-d);}
  .kcard{background:#fff;border-radius:9px;padding:10px 12px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;transition:.12s;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .kcard:hover{border-color:var(--amber);box-shadow:0 2px 8px rgba(0,0,0,.1);}
  .kcard-spk{font-family:'Barlow Condensed';font-size:17px;font-weight:700;color:var(--navy);}
  .kcard-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .kcard-customer{max-width:56%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#EEF2F7;border-radius:5px;padding:3px 6px;color:var(--text2);font-size:10px;text-align:right;}
  .kcard-xfd{font-size:11.5px;color:var(--text2);margin-top:1px;}
  .kcard-xfd.ov{color:var(--red);font-weight:600;}
  .kcard-qty{font-size:11.5px;color:var(--text2);margin-bottom:4px;}
  .dashboard-mat-list{margin-top:8px;padding-top:7px;border-top:1px solid var(--line);}
  .dashboard-mat-heading,.dashboard-mat-row{display:grid;grid-template-columns:minmax(72px,.9fr) minmax(72px,1fr) minmax(72px,1fr);gap:6px;align-items:center;}
  .dashboard-mat-heading{margin-bottom:4px;color:var(--text2);font-size:9px;font-weight:700;text-transform:uppercase;}
  .dashboard-mat-row{margin-top:5px;}
  .dashboard-mat-name{font-size:10px;font-weight:600;overflow-wrap:anywhere;}
  .dashboard-mat-cell{min-width:0;font-size:9px;color:var(--text2);}
  .dashboard-mat-track{height:4px;margin-top:2px;border-radius:3px;background:#EDEDEF;overflow:hidden;}
  .dashboard-mat-fill{height:100%;border-radius:3px;}
  .dashboard-mat-fill.ready{background:var(--amber);}
  .dashboard-mat-fill.taken{background:#2563EB;}
  .dashboard-mat-fill.full{background:var(--green);}
  .dashboard-request-materials{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);}
  .dashboard-request-heading{font-size:9px;color:var(--text2);font-weight:700;text-transform:uppercase;margin-bottom:6px;}
  .dashboard-request-list{display:flex;flex-wrap:wrap;gap:5px;}
  .dashboard-request-list span{background:#EAF5D5;color:#405A1C;border-radius:4px;padding:3px 6px;font-size:10px;font-weight:600;}
  .history-table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px;}
  .history-table{width:100%;border-collapse:collapse;font-size:12px;}
  .history-table th,.history-table td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top;}
  .history-table th{color:var(--text2);font-size:10px;text-transform:uppercase;}
  .history-table tr:last-child td{border-bottom:none;}
  .taken-history-table{min-width:1240px;}
  .taken-component-qty{font-weight:700;white-space:nowrap;}
  .taken-component-balance{font-size:11px;color:var(--text2);margin:3px 0 6px;}
  .taken-component-balance.complete{color:var(--green-d);font-weight:600;}
  .taken-component-events{display:grid;gap:3px;}
  .taken-component-event{font-size:10.5px;color:var(--text2);white-space:nowrap;}
  .taken-complete-date{color:var(--green-d);font-weight:700;white-space:nowrap;}
  .kprog{margin-top:5px;}
  .kprog-lbl{font-size:11px;color:var(--text2);display:flex;justify-content:space-between;margin-bottom:2px;}
  .kprog-track{background:#EDEDEF;border-radius:4px;height:5px;overflow:hidden;}
  .kprog-fill{height:100%;border-radius:4px;}
  .kprog-fill.am{background:var(--amber);}
  .kprog-fill.gn{background:var(--green);}
  .kcard-ret{font-size:11px;color:var(--red-d);background:var(--red-bg);border-radius:4px;padding:2px 6px;margin-top:5px;display:inline-block;}
  .kcol-empty{text-align:center;color:var(--text2);font-size:12px;padding:16px 0;}
  /* Bulk input */
  .bulk-wrap{background:var(--card);border:1px solid var(--amber);border-radius:12px;padding:16px;margin-bottom:16px;}
  .bulk-wrap h3{font-size:15px;color:var(--navy);margin-bottom:12px;font-family:'Barlow Condensed';}
  .bulk-table{width:100%;border-collapse:collapse;font-size:13px;}
  .bulk-table-wrap{overflow-x:auto;}
  .bulk-table{min-width:900px;}
  .bulk-table th{text-align:left;padding:5px 8px;font-size:11px;color:var(--text2);font-weight:600;border-bottom:1px solid var(--line);text-transform:uppercase;}
  .bulk-table td{padding:3px 6px;vertical-align:middle;}
  .bulk-table input[type=text],.bulk-table input[type=number]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;}
  .bulk-table input[type=date]{padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;width:100%;}
  .bulk-table input[type=checkbox]{accent-color:var(--amber-d);}
  .bulk-materials{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;min-width:160px;}
  .bulk-materials label{display:flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap;}
  .request-date-label{font-size:12px;color:var(--text2);margin:-4px 0 10px;}
  .col-no{width:28px;text-align:center;color:var(--text2);font-size:12px;}
  .col-qty{width:90px;}
  .col-xfd{width:140px;}
  .col-customer{width:190px;}
  .col-del{width:32px;text-align:center;}
  .del-row-btn{background:none;border:none;color:var(--text2);cursor:pointer;font-size:13px;padding:3px 6px;border-radius:4px;}
  .del-row-btn:hover{color:var(--red);background:var(--red-bg);}
  .bulk-actions{display:flex;gap:10px;margin-top:10px;align-items:center;flex-wrap:wrap;}
  .bulk-hint{font-size:11.5px;color:var(--text2);}
  .dashboard-actions{position:relative;z-index:30;flex:0 0 auto;}
  .dashboard-actions summary{width:42px;height:42px;display:flex;align-items:center;justify-content:center;padding:0;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;list-style:none;}
  .dashboard-actions summary::-webkit-details-marker{display:none;}
  .dashboard-actions summary:hover,.dashboard-actions[open] summary{background:rgba(255,255,255,.16);}
  .menu-icon{display:grid;gap:4px;width:20px;}
  .menu-icon span{height:2px;width:20px;border-radius:2px;background:currentColor;}
  .dashboard-actions-menu{position:absolute;top:calc(100% + 8px);left:0;display:grid;gap:6px;min-width:220px;padding:8px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-md);}
  .dashboard-actions-menu .btn{text-align:left;white-space:nowrap;}
  .dashboard-actions-menu .spk-import-input{display:none;}
  .request-batch-rows{display:grid;gap:12px;}
  .request-batch-row{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:9px;}
  .request-batch-row-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .request-spk-field{position:relative;flex:1;min-width:180px;}
  .request-spk-field input{width:100%;min-width:0;}
  .request-spk-suggestions{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:25;display:grid;max-height:260px;overflow:auto;padding:5px;background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:var(--shadow-md);}
  .request-spk-suggestions button{display:grid;gap:2px;padding:8px 9px;border:0;border-radius:5px;background:#fff;text-align:left;color:var(--text);cursor:pointer;}
  .request-spk-suggestions button:hover,.request-spk-suggestions button:focus{background:#F3F6F2;outline:none;}
  .request-spk-suggestions small{color:var(--text2);font-size:11px;}
  .request-spk-suggestions .no-match{padding:8px 9px;color:var(--text2);font-size:12px;}
  .request-batch-status{font-size:12px;font-weight:600;}
  .request-batch-status.found{color:var(--green-d);}
  .request-batch-status.missing{color:var(--red-d);}
  .request-batch-actions{display:flex;gap:7px;flex-wrap:wrap;}
  .request-batch-actions button{font-size:12px;}
  .request-batch-actions .btn:disabled{opacity:.45;cursor:not-allowed;}
  .import-history-meta{color:var(--text2);font-size:12px;}
  .spk-request-form{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;display:grid;gap:12px;}
  .spk-request-form label{display:block;font-size:11.5px;color:var(--text2);margin-bottom:4px;}
  .spk-request-form input[type=text],.spk-request-form input[type=date],.spk-request-form input[type=number]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;}
  .spk-suggestions{display:grid;gap:4px;margin-top:6px;}

function esc(s){
  const d = document.createElement('div');
  d.innerText = s == null ? '' : String(s);
  return d.innerHTML;
}
function todayStr(){ return dayjs().format('YYYY-MM-DD'); }
function fmtDate(d){ return d ? dayjs(d).format('DD MMM YY') : '-'; }
function fmtDateTime(d){ return d ? dayjs(d).format('DD MMM YYYY HH:mm') : '-'; }

async function api(path, opts={}){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(state.token) headers['x-auth-token'] = state.token;
  const res = await fetch('/api'+path, Object.assign({}, opts, {headers}));
  if(res.status === 403){ showToast('Akses ditolak untuk peran ini.'); throw new Error('forbidden'); }
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || 'Terjadi kesalahan.');
  return data;
}
function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.innerText = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2500);
}

function stageSum(stage){ return stage.history.reduce((a,h)=>a+Number(h.qty),0); }
function stageStatus(stage, qtyTotal){
  const sum = stageSum(stage);
  if(sum <= 0) return 'pending';
  if(sum >= qtyTotal) return 'ok';
  return 'partial';
}
function matSum(history, mat){
  if(mat==='IP') return history.filter(h=>!h.material||h.material==='IP').reduce((a,h)=>a+Number(h.qty),0);
  return history.filter(h=>h.material===mat).reduce((a,h)=>a+Number(h.qty),0);
}
function itemMaterials(item){
  return Array.isArray(item.materials)&&item.materials.length?item.materials:MATERIALS;
}
function materialsComplete(history, qty, materials=MATERIALS){
  return materials.every(material=>matSum(history,material)>=Number(qty));
}
function hasMaterialProgress(history, materials=MATERIALS){
  return materials.some(material=>matSum(history,material)>0);
}
function takenCompletionDate(item){
  const materials=itemMaterials(item);
  const totals=Object.fromEntries(materials.map(material=>[material,0]));
  for(const entry of item.pengambilan.history){
    if(materials.includes(entry.material)) totals[entry.material]+=Number(entry.qty);
    if(materials.every(material=>totals[material]>=Number(item.qty))) return entry.date;
  }
  return null;
}
function activeReturan(item){ return item.returan.filter(r=>r.status==='pending'); }
// Menghitung total retur gudang vs closingan, dan sisa yang belum ditutup.
// Contoh: retur gudang 4 pasang, closingan 3 pasang -> sisa 1 pasang masih retur aktif.
function returanTotals(item){
  const gudangEntries = item.returan.filter(r=>r.type!=='closing');
  const closingEntries = item.returan.filter(r=>r.type==='closing');
  const totalGudang = gudangEntries.reduce((a,r)=>a+Number(r.qty),0);
  const totalClosing = closingEntries.reduce((a,r)=>a+Number(r.qty),0);
  const sisa = Math.max(0, totalGudang - totalClosing);
  return { totalGudang, totalClosing, sisa, gudangEntries, closingEntries };
}
function xfdStatus(xfdDate, isDone){
  if(isDone) return {cls:'', icon:''};
  const days = dayjs(xfdDate).diff(dayjs(),'day');
  if(days < 0) return {cls:'xfd-overdue', icon:' ⚠'};
  if(days < 7) return {cls:'xfd-urgent', icon:' ⚠'};
  if(days <= 14) return {cls:'xfd-warn', icon:''};
  return {cls:'xfd-ok', icon:''};
}

    return matches&&(!query||it.spk.toLowerCase().includes(query))&&matchesComponentFilter(it);
  });
  const historyItems=stage==='taken'?state.items.filter(it=>it.pengambilan.history.length>0&&(!query||it.spk.toLowerCase().includes(query))):[];

function renderTakenHistory(items){
  const grouped=new Map();
  for(const item of items){
    const spk=String(item.spk||'').trim().toUpperCase();
    if(!grouped.has(spk)) grouped.set(spk,{spk,style:item.style||'',customer:item.customer||'',targets:Object.fromEntries(MATERIALS.map(material=>[material,0])),events:Object.fromEntries(MATERIALS.map(material=>[material,[]]))});
    const group=grouped.get(spk);
    for(const material of itemMaterials(item)){
      if(MATERIALS.includes(material)) group.targets[material]+=Number(item.qty)||0;
    }
    for(const entry of item.pengambilan.history){
      if(group.events[entry.material]) group.events[entry.material].push(entry);
    }
    if(!group.style&&item.style) group.style=item.style;
    if(!group.customer&&item.customer) group.customer=item.customer;
  }
  const groups=[...grouped.values()].map(group=>{
    const totals=Object.fromEntries(MATERIALS.map(material=>[material,group.events[material].reduce((sum,entry)=>sum+(Number(entry.qty)||0),0)]));
    const required=MATERIALS.filter(material=>group.targets[material]>0);
    const chronological=MATERIALS.flatMap(material=>group.events[material].map(entry=>({material,entry})))
      .sort((left,right)=>new Date(left.entry.date)-new Date(right.entry.date));
    const cumulative=Object.fromEntries(MATERIALS.map(material=>[material,0]));
    let completedDate=null;
    for(const {material,entry} of chronological){
      cumulative[material]+=(Number(entry.qty)||0);
      if(required.length&&required.every(component=>cumulative[component]>=group.targets[component])){
        completedDate=entry.date;
        break;
      }
    }
    group.totals=totals;
    group.completedDate=completedDate;
    group.lastActivity=chronological.length?chronological[chronological.length-1].entry.date:null;
    return group;
  }).filter(group=>!state.componentFilters.length||state.componentFilters.some(material=>group.targets[material]>0))
    .sort((left,right)=>new Date(right.lastActivity||0)-new Date(left.lastActivity||0));
  const renderComponent=group=>material=>{
    const target=group.targets[material];
    if(!target) return '<span class="taken-component-balance">Tidak diminta</span>';
    const taken=group.totals[material];
    const balance=Math.max(0,target-taken);
    const events=group.events[material].slice().sort((left,right)=>new Date(left.date)-new Date(right.date));
    return `<div class="taken-component-qty">${taken}/${target}</div><div class="taken-component-balance ${balance===0?'complete':''}">${balance===0?'Lengkap':`Balance ${balance}`}</div><div class="taken-component-events">${events.map(entry=>`<div class="taken-component-event">${fmtDate(entry.date)} · +${Number(entry.qty)||0} · ${esc(entry.pic||entry.by||'-')}</div>`).join('')}</div>`;
  };
  return `<div class="pipeline-title" style="margin-top:24px">History Pengambilan (${groups.length} SPK)</div>
    ${groups.length?`<div class="history-table-wrap"><table class="history-table taken-history-table"><thead><tr><th>SPK</th><th>STYLE</th><th>CUSTOMER</th>${MATERIALS.map(material=>`<th>${esc(material)}</th>`).join('')}<th>TANGGAL OK TAKEN</th></tr></thead><tbody>${groups.map(group=>`<tr><td><strong>${esc(group.spk)}</strong></td><td>${esc(group.style||'-')}</td><td>${esc(group.customer||'-')}</td>${MATERIALS.map(material=>`<td>${renderComponent(group)(material)}</td>`).join('')}<td>${group.completedDate?`<span class="taken-complete-date">${fmtDate(group.completedDate)}</span>`:'Belum OK'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada riwayat pengambilan.</div>'}`;
}

      <button class="btn ghost" id="addRequestRow">+ Tambah SPK</button>
      <button class="btn ghost" id="lookupRequestRows">Cari Semua SPK</button>
      <button class="btn amber" id="saveBulkRequests">Simpan Semua Request</button>
      <button class="btn ghost" id="cancelSpkRequest">Batal</button>
    </div>
  </div>`;
}

function createRequestRow(spk=''){
  return {id:state.requestRowSequence++,spk,status:'idle',master:null,manual:false,editSpk:false,materials:[],style:'',customer:'',xfd:todayStr(),qty:'',suggestions:[],suggestionState:'idle',suggestionTimer:null};
}

function renderRequestRow(row,index){
  const master=row.master;
  const available=master?MATERIALS.filter(material=>!(master.requestedMaterials||[]).includes(material)):MATERIALS;
  const status=row.status==='found'?`<span class="request-batch-status found">SPK ditemukan</span>`:row.status==='missing'?`<span class="request-batch-status missing">SPK ${esc(row.spk)} tidak ditemukan</span>`:row.status==='manual'?`<span class="request-batch-status missing">Input manual untuk ${esc(row.spk)}</span>`:row.status==='searching'?'<span class="request-batch-status">Mencari...</span>':'';
  const suggestions=row.status==='idle'&&row.suggestionState!=='idle'?`<div class="request-spk-suggestions">${row.suggestionState==='loading'?'<div class="no-match">Mencari SPK...</div>':row.suggestionState==='empty'?'<div class="no-match">Tidak ada SPK yang mendekati.</div>':row.suggestions.map((suggestion,suggestionIndex)=>`<button type="button" data-select-request-suggestion="${row.id}" data-suggestion-index="${suggestionIndex}"><strong>${esc(suggestion.spk)}</strong><small>${esc(suggestion.style)} · ${esc(suggestion.customer)}</small></button>`).join('')}</div>`:'';
  return `<div class="request-batch-row" data-request-row="${row.id}">
    <div class="request-batch-row-head"><strong>${index+1}.</strong><div class="request-spk-field"><input type="text" class="request-batch-spk" data-row-id="${row.id}" value="${esc(row.spk)}" placeholder="SPK" autocomplete="off">${suggestions}</div>${status}<button class="del-row-btn" type="button" data-remove-request-row="${row.id}" title="Hapus SPK">Hapus</button></div>
    ${row.status==='missing'||row.status==='manual'?`<div class="request-batch-actions"><button class="btn ghost sm" type="button" data-edit-request-spk="${row.id}">Ubah SPK</button>${row.status==='missing'?`<button class="btn ghost sm" type="button" data-manual-request-spk="${row.id}">Input Manual</button>`:''}</div>`:''}
    ${master?`<div class="spk-master-details"><div><span>STYLE</span><strong>${esc(master.style)}</strong></div><div><span>CUSTOMER</span><strong>${esc(master.customer)}</strong></div><div><span>XFD</span><strong>${fmtDate(master.xfd)}</strong></div><div><span>QTY</span><strong>${master.qty}</strong></div></div>`:''}
    ${row.manual?`<div class="spk-manual-fields"><div><label>STYLE</label><input type="text" data-row-field="style" data-row-id="${row.id}" value="${esc(row.style)}" placeholder="STYLE"></div><div><label>CUSTOMER</label><input type="text" data-row-field="customer" data-row-id="${row.id}" value="${esc(row.customer)}" placeholder="CUSTOMER"></div><div><label>XFD</label><input type="date" data-row-field="xfd" data-row-id="${row.id}" value="${esc(row.xfd)}"></div><div><label>QTY</label><input type="number" min="1" data-row-field="qty" data-row-id="${row.id}" value="${esc(row.qty)}" placeholder="QTY"></div></div>`:''}
    ${(master||row.manual)?`<div><label>Material dibutuhkan</label>${available.length?`<div class="spk-material-options">${available.map(material=>`<label><input type="checkbox" class="request-material-choice" data-row-id="${row.id}" value="${esc(material)}" ${row.materials.includes(material)?'checked':''}>${esc(material)}</label>`).join('')}</div>`:'<div class="bulk-hint">Semua material untuk SPK ini sudah pernah diminta.</div>'}</div>`:''}
  </div>`;
}

function renderKanbanCol(cls, title, zh, items, stage){
  return `
  <div class="kcol ${cls}">
    <div class="kcol-head">
      <div><span class="kcol-title">${title}</span><span class="kcol-zh">${zh}</span></div>
      <span class="kcol-badge">${items.length}</span>
    </div>
    ${items.length===0 ? '<div class="kcol-empty">Kosong</div>' : items.map(it=>renderKanbanCard(it,stage)).join('')}
  </div>`;
}

function renderKanbanCard(it, stage){
  const whIPqty = matSum(it.whReady.history,'IP');
  const whRBqty = matSum(it.whReady.history,'RB_TPU');
  const pengIPqty = matSum(it.pengambilan.history,'IP');
  const pengRBqty = matSum(it.pengambilan.history,'RB_TPU');
  const ps = stageStatus(it.pengambilan, it.qty);
  const xfd = xfdStatus(it.xfd, ps==='ok');
  const rt = returanTotals(it);
  function mp(label,qty,total,cls){
    const pct=Math.min(100,total>0?qty/total*100:0);
    return `<div class="kprog"><div class="kprog-lbl"><span><span class="mat-badge ${cls}" style="font-size:9px;padding:0 4px;">${label}</span></span><span>${qty}/${total}</span></div><div class="kprog-track"><div class="kprog-fill ${qty>=total?'gn':'am'}" style="width:${pct}%"></div></div></div>`;
  }
  let prog='';
  if(stage==='gudang'){
    prog = mp('IP',whIPqty,it.qty,'ip') + mp('RB/TPU',whRBqty,it.qty,'rb');
  } else if(stage==='pengambilan'){
    prog = mp('IP',pengIPqty,it.qty,'ip') + mp('RB/TPU',pengRBqty,it.qty,'rb');
  } else if(stage==='retur'){
    prog=`<div style="font-size:11px;margin-top:4px;">Retur gudang ${rt.totalGudang} · closingan ${rt.totalClosing}</div>`;
  }
  return `<div class="kcard" data-goto="${it.id}">
    <div class="kcard-spk">${esc(it.spk)}</div>
    <div class="kcard-xfd ${xfd.cls}">XFD ${fmtDate(it.xfd)}${xfd.icon}</div>
    <div class="kcard-qty">QTY ${it.qty}</div>
    ${prog}${rt.sisa>0?`<div class="kcard-ret">⚠ Sisa retur ${rt.sisa} pasang</div>`:''}
  </div>`;
}

function renderItemCard(it, p){
  const ws = stageStatus(it.whReady, it.qty);
  const ps = stageStatus(it.pengambilan, it.qty);
  const rt = returanTotals(it);
  const isOpen = state.expanded === it.id;
  const xfd = xfdStatus(it.xfd, ps==='ok');
  return `
  <div class="item-card">
    <div class="item-head" data-toggle="${it.id}">
      <div>
        <div class="spk">${esc(it.spk)}</div>
        <div class="meta ${xfd.cls}">XFD ${fmtDate(it.xfd)}${xfd.cls==='xfd-overdue'?' · terlewat':xfd.icon} · QTY ${it.qty}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="stages-mini">
          <span class="stat-pill ok">Planning ✓</span>
          <span class="stat-pill ${ws}">WH ${ws==='ok'?'OK':ws==='partial'?'Parsial':'-'}</span>
          <span class="stat-pill ${ps}">Ambil ${ps==='ok'?'OK':ps==='partial'?'Parsial':'-'}</span>
          ${rt.sisa>0 ? `<span class="stat-pill hasret">Sisa retur ${rt.sisa}</span>` : ''}
        </div>
        ${p.canDeleteItem ? `<button class="del-spk-btn" data-del-item="${it.id}" title="Hapus SPK">🗑️ Hapus</button>` : ''}

}

function renderItemDetail(it,p,ws,ps){
  const rt = returanTotals(it);
  const whIPqty = matSum(it.whReady.history,'IP');
  const whRBqty = matSum(it.whReady.history,'RB_TPU');
  const pengIPqty = matSum(it.pengambilan.history,'IP');
  const pengRBqty = matSum(it.pengambilan.history,'RB_TPU');
  function mpBar(qty,total){
    const pct=Math.min(100,total>0?qty/total*100:0);
    return `<div style="font-size:11px;color:var(--text2);text-align:right;margin-bottom:2px;">${qty} / ${total}${qty>=total?' ✓':` · kurang ${total-qty}`}</div><div class="kprog-track"><div class="kprog-fill ${qty>=total?'gn':'am'}" style="width:${pct}%"></div></div>`;
  }
  function histRow(h){
    return `<div class="hist-row"><span><span class="hist-mat ${h.material==='RB_TPU'?'rb':'ip'}">${h.material==='RB_TPU'?'RB/TPU':'IP'}</span>${fmtDate(h.date)} · ${esc(h.pic||h.by)}${h.notes?` <span class="hist-notes">"${esc(h.notes)}"</span>`:''}</span><span>+${h.qty}</span></div>`;
  }
  return `
  <div class="stage-grid">
    <div class="stage-box">
      <h4>Planning</h4>
      <div class="planning-done-tag">✓ Selesai · ${fmtDate(it.planning.date || it.createdAt)}</div>
    </div>

    <div class="stage-box">
      <h4>WH Siap (Persiapan Gudang)</h4>
      <div class="mat-prog-row"><span class="mat-badge ip">IP</span><div style="flex:1;min-width:0;">${mpBar(whIPqty,it.qty)}</div></div>
      <div class="mat-prog-row" style="margin-top:4px;"><span class="mat-badge rb">RB/TPU</span><div style="flex:1;min-width:0;">${mpBar(whRBqty,it.qty)}</div></div>
      <div style="margin-top:6px;">${it.whReady.history.length>0 ? it.whReady.history.map(h=>histRow(h)).join('') : '<div style="font-size:12px;color:var(--text2);">Belum ada data</div>'}</div>
      ${p.canEditWhReady ? `
      <div class="mat-form">
        <div class="mat-row">
          <select id="wh-mat-${it.id}" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;flex:0 0 auto;"><option value="IP">IP</option><option value="RB_TPU">RB/TPU</option></select>
          <input type="number" min="1" placeholder="qty" id="wh-qty-${it.id}" />
          <input type="date" value="${todayStr()}" id="wh-date-${it.id}" />
          <input type="text" placeholder="PIC" id="wh-pic-${it.id}" />
          <button class="btn sm" data-add-wh="${it.id}">+</button>
        </div>
        <div class="mat-notes-row"><input type="text" placeholder="Notes (opsional)" id="wh-notes-${it.id}" /></div>
      </div>` : `<div class="locked">Hanya PPIC/WH</div>`}
    </div>

    <div class="stage-box">
      <h4>Pengambilan (Ambil Bahan)</h4>
      <div class="mat-prog-row"><span class="mat-badge ip">IP</span><div style="flex:1;min-width:0;">${mpBar(pengIPqty,it.qty)}</div></div>
      <div class="mat-prog-row" style="margin-top:4px;"><span class="mat-badge rb">RB/TPU</span><div style="flex:1;min-width:0;">${mpBar(pengRBqty,it.qty)}</div></div>
      <div style="margin-top:6px;">${it.pengambilan.history.length>0 ? it.pengambilan.history.map(h=>histRow(h)).join('') : '<div style="font-size:12px;color:var(--text2);">Belum ada data</div>'}</div>
      ${p.canEditPengambilan ? `
      <div class="mat-form">
        <div class="mat-row">
          <select id="peng-mat-${it.id}" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;flex:0 0 auto;"><option value="IP">IP</option><option value="RB_TPU">RB/TPU</option></select>
          <input type="number" min="1" placeholder="qty" id="peng-qty-${it.id}" />
          <input type="date" value="${todayStr()}" id="peng-date-${it.id}" />
          <input type="text" placeholder="PIC" id="peng-pic-${it.id}" />
          <button class="btn sm" data-add-peng="${it.id}">+</button>
        </div>
        <div class="mat-notes-row"><input type="text" placeholder="Notes (opsional)" id="peng-notes-${it.id}" /></div>
      </div>` : `<div class="locked">Hanya PPIC/SF/Produksi</div>`}
    </div>

    <div class="stage-box">
      <h4>Retur</h4>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
        <span class="stat-pill" style="background:#FEF3DE;color:var(--amber-d);">Retur Gudang: ${rt.totalGudang}</span>
        <span class="stat-pill" style="background:var(--green-bg);color:var(--green-d);">Closingan: ${rt.totalClosing}</span>
        <span class="stat-pill ${rt.sisa>0?'hasret':'ok'}">Sisa: ${rt.sisa}</span>
      </div>
      ${rt.gudangEntries.length===0 && rt.closingEntries.length===0 ? `<div style="font-size:12px;color:var(--text2);">Belum ada retur</div>` : ''}
      ${rt.gudangEntries.map(r=>`
        <div class="ret-item">
          <div class="top"><span>Qty ${r.qty} <span style="font-size:10px;padding:1px 5px;border-radius:3px;background:#FEF3DE;color:var(--amber-d);">Retur Gudang</span>${r.status==='confirmed'?' <span style="font-size:10.5px;color:var(--green-d);font-weight:600;">✓ diterima WH</span>':''}</span><span>${fmtDate(r.date)}</span></div>
          <div class="meta">${esc(r.reason||'-')} · diajukan ${esc(r.by)}</div>
          ${p.canConfirmReturan && r.status==='pending' ? `<button class="btn sm ghost" style="margin-top:6px;" data-confirm-ret="${r.id}">Tandai OK (gudang)</button>` : ''}
        </div>
      `).join('')}
      ${rt.closingEntries.map(r=>`
        <div class="ret-item" style="background:var(--green-bg);border-color:#BEE3C6;">
          <div class="top" style="color:var(--green-d);"><span>Qty ${r.qty} <span style="font-size:10px;padding:1px 5px;border-radius:3px;background:#fff;color:var(--green-d);">Closingan</span></span><span>${fmtDate(r.date)}</span></div>
          <div class="meta">${esc(r.reason||'-')} · diajukan ${esc(r.by)}</div>
        </div>
      `).join('')}
      ${p.canAddReturan ? `
      <div class="inline-form">
        <select id="ret-type-${it.id}" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;flex:0 0 auto;">
          <option value="gudang">Retur Gudang</option>
          <option value="closing">Closingan</option>
        </select>
        <input type="number" min="1" placeholder="qty" id="ret-qty-${it.id}" />
        <input type="text" placeholder="alasan" id="ret-reason-${it.id}" />
        <button class="btn sm" data-add-ret="${it.id}">Ajukan</button>
      </div>` : `<div class="locked">Hanya PPIC/WH/SF</div>`}
    </div>
  </div>`;
}

function renderItemCard(it,p){
  const isOpen=state.expanded===it.id;
  const materials=itemMaterials(it);
  const readyCount=materials.filter(material=>matSum(it.whReady.history,material)>=it.qty).length;
  const takenCount=materials.filter(material=>matSum(it.pengambilan.history,material)>=it.qty).length;
  const stageLabel=state.tab==='request'?'Request Produksi':state.tab==='ready'?'Marketing Ready':'Taken';
  return `<div class="item-card">
    <div class="item-head" data-toggle="${it.id}">
      <div><div class="spk">${esc(it.spk)}</div><div class="meta">${it.style?`STYLE ${esc(it.style)} · `:''}Request ${fmtDate(it.createdAt)} · XFD ${fmtDate(it.xfd)} · QTY ${it.qty}</div></div>
      <div class="stages-mini"><span class="stat-pill pending">${stageLabel}</span><span class="stat-pill ${readyCount===materials.length?'ok':'partial'}">Ready ${readyCount}/${materials.length}</span><span class="stat-pill ${takenCount===materials.length?'ok':'pending'}">Taken ${takenCount}/${materials.length}</span>${p.canDeleteItem?`<button class="del-spk-btn" data-del-item="${it.id}" title="Hapus request">Hapus</button>`:''}</div>
    </div>
    <div class="item-body ${isOpen?'open':''}">${isOpen?renderItemDetail(it,p):''}</div>
  </div>`;
}

function renderItemDetail(it,p){
  function materialProgress(history){
    return itemMaterials(it).map(material=>{
      const qty=matSum(history,material);
      const pct=Math.min(100,it.qty>0?qty/it.qty*100:0);
      return `<div class="mat-prog-row"><span class="mat-badge ip">${material}</span><div style="flex:1;min-width:0"><div style="font-size:11px;color:var(--text2);text-align:right">${qty} / ${it.qty}</div><div class="kprog-track"><div class="kprog-fill ${qty>=it.qty?'gn':'am'}" style="width:${pct}%"></div></div></div></div>`;
    }).join('');
  }
  function historyRows(history){
    return history.length?history.map(h=>`<div class="hist-row"><span>${esc(h.material||'Material lama')} · ${fmtDate(h.date)} · ${esc(h.pic||h.by)}${h.notes?` · ${esc(h.notes)}`:''}</span><span>+${h.qty}</span></div>`).join(''):'<div style="font-size:12px;color:var(--text2);margin:8px 0">Belum ada pencatatan</div>';
  }
  function entryForm(prefix,canEdit){
    if(!canEdit)return '<div class="locked">Hanya Marketing atau Master</div>';
    return `<div class="mat-form"><div class="mat-row"><select id="${prefix}-mat-${it.id}">${itemMaterials(it).map(material=>`<option value="${material}">${material}</option>`).join('')}</select><input type="number" min="1" placeholder="Qty" id="${prefix}-qty-${it.id}"/><input type="date" value="${todayStr()}" id="${prefix}-date-${it.id}"/><input type="text" placeholder="PIC" id="${prefix}-pic-${it.id}"/><button class="btn sm" data-add-${prefix}="${it.id}">Simpan</button></div><div class="mat-notes-row"><input type="text" placeholder="Catatan (opsional)" id="${prefix}-notes-${it.id}"/></div></div>`;
  }
  return `<div class="stage-grid">
    <div class="stage-box"><h4>Marketing Ready</h4>${materialProgress(it.whReady.history)}${historyRows(it.whReady.history)}${entryForm('wh',p.canEditWhReady)}</div>
    <div class="stage-box"><h4>Taken</h4>${materialProgress(it.pengambilan.history)}${historyRows(it.pengambilan.history)}${entryForm('peng',p.canEditPengambilan)}</div>
  </div>`;
}

function attachEvents(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-role]').forEach(el=>{
    el.onclick = ()=>{ state.loginRoleSel = el.dataset.role; state.loginBuildingSel=null; state.loginErr=''; render(); };
  });
  app.querySelectorAll('[data-building]').forEach(el=>{
    el.onclick=()=>{ state.loginBuildingSel=el.dataset.building; state.loginErr=''; render(); };
  });
  const loginGo = document.getElementById('loginGo');
  if(loginGo){
    loginGo.onclick = async ()=>{
      const val = document.getElementById('passInput').value;
      try{
        const data = await api('/login', {method:'POST', body: JSON.stringify({role: state.loginRoleSel, building: state.loginBuildingSel, passcode: val})});
        state.role = data.role; state.token = data.token; state.building=data.building||null;
        localStorage.setItem('gudang_role', data.role);
        localStorage.setItem('gudang_token', data.token);
        if(state.building) localStorage.setItem('gudang_building',state.building);
        else localStorage.removeItem('gudang_building');
        state.loginErr=''; state.loginRoleSel=null;
        state.loginBuildingSel=null;
        state.loading = true; render();
        await loadItems(); render();
      }catch(e){
        state.loginErr = e.message || 'Password salah.'; render();
      }
    };
  }
  const vo = document.getElementById('viewOnlyBtn');
  if(vo) vo.onclick = async ()=>{
    state.role='VIEW'; state.token=null; state.building=null;
    localStorage.removeItem('gudang_token'); localStorage.setItem('gudang_role','VIEW');
    localStorage.removeItem('gudang_building');
    state.loading = true; render();
    await loadItems(); render();
  };

  const logout = document.getElementById('logoutBtn');
  if(logout) logout.onclick = ()=>{
    state.role=null; state.token=null; state.building=null; state.tab='dashboard';
    localStorage.removeItem('gudang_role'); localStorage.removeItem('gudang_token');
    localStorage.removeItem('gudang_building');
    render();
  };

  app.querySelectorAll('[data-tab]').forEach(el=>{
    el.onclick = ()=>{
      state.tab=el.dataset.tab;
      render();
      if(state.tab==='import-history') loadImportHistory();
    };
  });
  const refreshImportHistory=document.getElementById('refreshImportHistory');
  if(refreshImportHistory) refreshImportHistory.onclick=loadImportHistory;

  const search = document.getElementById('searchBox');
  if(search){
    search.oninput = (e)=>{
      state.search = e.target.value; render();
      const sb = document.getElementById('searchBox');
      sb.focus(); sb.setSelectionRange(state.search.length,state.search.length);
    };
  }
  const dashSrch = document.getElementById('dashSearch');
  if(dashSrch){
    dashSrch.oninput = (e)=>{
      state.dashSearch = e.target.value; render();
      const d = document.getElementById('dashSearch');
      if(d){ d.focus(); d.setSelectionRange(state.dashSearch.length, state.dashSearch.length); }
    };
  }
  const componentFilter = app.querySelector('.component-filter');
  if(componentFilter){
    componentFilter.addEventListener('toggle',()=>{ state.componentFilterOpen=componentFilter.open; });
    componentFilter.querySelectorAll('input[type="checkbox"]').forEach(input=>{
      input.onchange=()=>{
        state.componentFilters=[...componentFilter.querySelectorAll('input:checked')].map(checkbox=>checkbox.value);
        state.componentFilterOpen=true;
        render();
      };
    });
  }
  const exportExcel = document.getElementById('exportExcel');
  if(exportExcel) exportExcel.onclick = async ()=>{
    exportExcel.disabled=true;
    try{
      const headers={};
      if(state.token) headers['x-auth-token']=state.token;
      const response=await fetch('/api/export.xlsx',{headers});
      if(!response.ok){
        const error=await response.json().catch(()=>({}));
        throw new Error(error.error||'Gagal mengunduh file Excel.');
      }
      const blob=await response.blob();
      const url=URL.createObjectURL(blob);
      const link=document.createElement('a');
      link.href=url; link.download=`Marketing-System-${todayStr()}.xlsx`;
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      showToast('File Excel berhasil diunduh.');
    }catch(e){ showToast(e.message); }
    finally{ exportExcel.disabled=false; }
  };
  const spkTemplateButton = document.getElementById('spkTemplateButton');
  if(spkTemplateButton) spkTemplateButton.onclick = async ()=>{
    spkTemplateButton.disabled=true;
    try{
      const headers={};
      if(state.token) headers['x-auth-token']=state.token;
      const response=await fetch('/api/spk/template.xlsx',{headers});
      if(!response.ok){
        const error=await response.json().catch(()=>({}));
        throw new Error(error.error||'Gagal mengunduh template Excel.');
      }
      const url=URL.createObjectURL(await response.blob());
      const link=document.createElement('a');
      link.href=url; link.download='Template-Master-SPK.xlsx';
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      showToast('Template Master SPK berhasil diunduh.');
    }catch(e){ showToast(e.message); }
    finally{ spkTemplateButton.disabled=false; }
  };
  const importSpkButton = document.getElementById('importSpkButton');
  const spkImportInput = document.getElementById('spkImportInput');
  if(importSpkButton&&spkImportInput) importSpkButton.onclick=()=>spkImportInput.click();
  if(spkImportInput) spkImportInput.onchange=async ()=>{
    const file=spkImportInput.files[0];
    if(!file) return;
    importSpkButton.disabled=true;
    try{
      const headers={'Content-Type':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','x-file-name':encodeURIComponent(file.name)};
      if(state.token) headers['x-auth-token']=state.token;
      const response=await fetch('/api/spk/import',{method:'POST',headers,body:file});
      const result=await response.json();
      if(!response.ok) throw new Error(result.error||'Gagal mengimpor data SPK.');
      state.items=await api('/items');
      render();
      showToast(`${result.imported} SPK: ${result.newSpks} baru, ${result.updatedSpks} diperbarui.`);
    }catch(e){ showToast(e.message); }
    finally{ importSpkButton.disabled=false; spkImportInput.value=''; }
  };
  const dashboardAdd = document.getElementById('dashboardAddRequest');
  if(dashboardAdd) dashboardAdd.onclick = ()=>{ state.tab='request'; state.addOpen=true; render(); };
  const toggleAdd = document.getElementById('toggleAdd');
  if(toggleAdd) toggleAdd.onclick = ()=>{ state.addOpen = !state.addOpen; if(state.addOpen&&!state.requestRows.length) state.requestRows=[createRequestRow()]; render(); };

  const addRequestRow=document.getElementById('addRequestRow');
  if(addRequestRow) addRequestRow.onclick=()=>{
    if(state.requestRows.length>=200){ showToast('Maksimal 200 request sekaligus.'); return; }
    const row=createRequestRow();
    state.requestRows.push(row);
    render();
    const input=app.querySelector(`.request-batch-spk[data-row-id="${row.id}"]`);
    if(input) input.focus();
  };
  app.querySelectorAll('.request-batch-spk').forEach(input=>{
    input.oninput=()=>{
      const spk=input.value.toUpperCase();
      input.value=spk;
      const row=state.requestRows.find(entry=>entry.id===Number(input.dataset.rowId));
      if(!row) return;
      clearTimeout(row.suggestionTimer);
      row.spk=spk;
      row.status='idle'; row.master=null; row.manual=false; row.editSpk=false; row.materials=[]; row.suggestions=[];
      row.suggestionState=spk?'loading':'idle';
      const caret=input.selectionStart;
      render();
      const current=app.querySelector(`.request-batch-spk[data-row-id="${row.id}"]`);
      if(current){ current.focus(); current.setSelectionRange(caret,caret); }
      if(spk) row.suggestionTimer=setTimeout(async ()=>{
        try{
          const suggestions=await api(`/spk?search=${encodeURIComponent(spk)}`);
          if(row.spk!==spk||row.status!=='idle') return;
          row.suggestions=suggestions;
          row.suggestionState=suggestions.length?'results':'empty';
          render();
          const focused=app.querySelector(`.request-batch-spk[data-row-id="${row.id}"]`);
          if(focused){ focused.focus(); focused.setSelectionRange(caret,caret); }
        }catch(error){
          if(row.spk!==spk) return;
          row.suggestionState='empty';
          render();
          showToast(error.message);
        }
      },220);
    };
  });
  app.querySelectorAll('[data-select-request-suggestion]').forEach(button=>{
    button.onclick=()=>{
      const row=state.requestRows.find(entry=>entry.id===Number(button.dataset.selectRequestSuggestion));
      const suggestion=row?.suggestions[Number(button.dataset.suggestionIndex)];
      if(!row||!suggestion) return;
      clearTimeout(row.suggestionTimer);
      row.spk=suggestion.spk;
      row.master=suggestion;
      row.status='found';
      row.manual=false;
      row.editSpk=false;
      row.materials=[];
      row.suggestions=[];
      row.suggestionState='idle';
      render();
    };
  });
  app.querySelectorAll('[data-row-field]').forEach(input=>{
    input.oninput=()=>{
      const row=state.requestRows.find(entry=>entry.id===Number(input.dataset.rowId));
      if(row) row[input.dataset.rowField]=input.dataset.rowField==='qty'?input.value:input.value.trimStart();
    };
  });
  app.querySelectorAll('.request-material-choice').forEach(input=>{
    input.onchange=()=>{
      const row=state.requestRows.find(entry=>entry.id===Number(input.dataset.rowId));
      if(!row) return;
      row.materials=input.checked?[...new Set([...row.materials,input.value])]:row.materials.filter(material=>material!==input.value);
    };
  });
  app.querySelectorAll('[data-remove-request-row]').forEach(button=>{
    button.onclick=()=>{ state.requestRows=state.requestRows.filter(row=>row.id!==Number(button.dataset.removeRequestRow)); render(); };
  });
  app.querySelectorAll('[data-edit-request-spk]').forEach(button=>{
    button.onclick=()=>{
      const row=state.requestRows.find(entry=>entry.id===Number(button.dataset.editRequestSpk));
      if(row){ row.status='idle'; row.master=null; row.manual=false; row.editSpk=true; row.materials=[]; }
      render();
      const input=app.querySelector(`.request-batch-spk[data-row-id="${button.dataset.editRequestSpk}"]`);
      if(input) input.focus();
    };
  });
  app.querySelectorAll('[data-manual-request-spk]').forEach(button=>{
    button.onclick=()=>{
      const row=state.requestRows.find(entry=>entry.id===Number(button.dataset.manualRequestSpk));
      if(row){ row.status='manual'; row.manual=true; row.editSpk=false; }
      render();
    };
  });
  const lookupRequestRows=document.getElementById('lookupRequestRows');
  if(lookupRequestRows) lookupRequestRows.onclick=async ()=>{
    state.requestRows.forEach(row=>{
      const input=app.querySelector(`.request-batch-spk[data-row-id="${row.id}"]`);
      if(input) row.spk=input.value.trim().toUpperCase();
    });
    const submitted=state.requestRows.filter(row=>row.spk);
    if(!submitted.length){ showToast('Masukkan minimal satu SPK.'); return; }
    state.requestRows.forEach(row=>{
      clearTimeout(row.suggestionTimer);
      row.suggestions=[]; row.suggestionState='idle';
      if(row.spk){ row.status='searching'; row.master=null; row.manual=false; row.materials=[]; }
    });
    render();
    try{
      const result=await api('/spk/lookup',{method:'POST',body:JSON.stringify({spks:submitted.map(row=>row.spk)})});
      const masters=new Map(result.results.map(master=>[master.spk,master]));
      state.requestRows.forEach(row=>{
        if(!row.spk) return;
        row.master=masters.get(row.spk)||null;
        row.status=row.master?'found':'missing';
        row.editSpk=false;
      });
      render();
      const missing=state.requestRows.filter(row=>row.spk&&row.status==='missing').map(row=>row.spk);
      if(missing.length) showToast(`SPK tidak ditemukan: ${[...new Set(missing)].join(', ')}. Pilih Ubah SPK atau Input Manual.`);
    }catch(error){
      state.requestRows.forEach(row=>{ if(row.status==='searching') row.status='idle'; });
      render();
      showToast(error.message);
    }
  };
  const cancelSpkRequest=document.getElementById('cancelSpkRequest');
  if(cancelSpkRequest) cancelSpkRequest.onclick=()=>{
    state.addOpen=false;
    state.requestRows=[];
    render();
  };
  const saveBulkRequests=document.getElementById('saveBulkRequests');
  if(saveBulkRequests) saveBulkRequests.onclick=async ()=>{
    const submitted=state.requestRows.filter(row=>row.spk);
    if(!submitted.length){ showToast('Masukkan minimal satu SPK.'); return; }
    const unresolved=submitted.filter(row=>row.status!=='found'&&row.status!=='manual');
    if(unresolved.length){ showToast(`Cari atau lengkapi SPK berikut: ${[...new Set(unresolved.map(row=>row.spk))].join(', ')}.`); return; }
    const noMaterials=submitted.filter(row=>!row.materials.length);
    if(noMaterials.length){ showToast(`Pilih material untuk: ${[...new Set(noMaterials.map(row=>row.spk))].join(', ')}.`); return; }
    const items=submitted.map(row=>{
      const item={spk:row.spk,materials:row.materials};
      if(row.manual) Object.assign(item,{style:row.style.trim(),customer:row.customer.trim(),xfd:row.xfd,qty:Number(row.qty)});
      return item;
    });
    saveBulkRequests.disabled=true;
    try{
      state.items=await api('/items/bulk',{method:'POST',body:JSON.stringify({items})});
      state.addOpen=false;
      state.requestRows=[];
      render();
      showToast(`${items.length} request berhasil disimpan.`);
    }catch(error){ showToast(error.message); saveBulkRequests.disabled=false; }
  };

  // Kanban card → buka di Data SPK
  app.querySelectorAll('[data-goto]').forEach(el=>{
    el.onclick = ()=>{
      state.tab=el.dataset.stage || 'request'; state.expanded=el.dataset.goto; render();
      setTimeout(()=>{ const c=document.querySelector(`[data-toggle="${el.dataset.goto}"]`); if(c) c.scrollIntoView({behavior:'smooth',block:'center'}); },80);
    };
  });

  app.querySelectorAll('[data-toggle]').forEach(el=>{
    el.onclick = ()=>{ const id = el.dataset.toggle; state.expanded = state.expanded===id ? null : id; render(); };
  });

  const addWh = app.querySelector('[data-add-wh]');
  if(addWh) addWh.onclick = async ()=>{
    const id = addWh.dataset.addWh;
    const qty = Number(document.getElementById('wh-qty-'+id).value);
    const date = document.getElementById('wh-date-'+id).value;
    const picEl = document.getElementById('wh-pic-'+id);
    const pic = picEl ? picEl.value.trim() : '';
    const matEl = document.getElementById('wh-mat-'+id);
    const material = matEl ? matEl.value : 'IP';
    const notesEl = document.getElementById('wh-notes-'+id);
    const notes = notesEl ? notesEl.value.trim() : '';
    if(!qty||qty<=0){ showToast('Isi qty.'); return; }
    const item = state.items.find(it=>it.id===id);
    if(item){
      const already = matSum(item.whReady.history, material);
      const remaining = item.qty - already;
      if(qty > remaining){ showToast(`Qty melebihi sisa ${material}: ${remaining}`); return; }
    }
    try{
      state.items = await api(`/items/${id}/wh-ready`, {method:'POST', body: JSON.stringify({qty, date, pic, material, notes})});
      render();
    }catch(e){ showToast(e.message); }
  };

  const addPeng = app.querySelector('[data-add-peng]');
  if(addPeng) addPeng.onclick = async ()=>{
    const id = addPeng.dataset.addPeng;
    const qty = Number(document.getElementById('peng-qty-'+id).value);
    const date = document.getElementById('peng-date-'+id).value;
    const picEl = document.getElementById('peng-pic-'+id);
    const pic = picEl ? picEl.value.trim() : '';
    const matEl = document.getElementById('peng-mat-'+id);
    const material = matEl ? matEl.value : 'IP';
    const notesEl = document.getElementById('peng-notes-'+id);
    const notes = notesEl ? notesEl.value.trim() : '';
    if(!qty||qty<=0){ showToast('Isi qty.'); return; }
    const item = state.items.find(it=>it.id===id);
    if(item){
      const already = matSum(item.pengambilan.history, material);
      const remaining = item.qty - already;
      if(qty > remaining){ showToast(`Qty melebihi sisa ${material}: ${remaining}`); return; }
    }
    try{
      state.items = await api(`/items/${id}/pengambilan`, {method:'POST', body: JSON.stringify({qty, date, pic, material, notes})});
      render();
    }catch(e){ showToast(e.message); }
  };

  const addRet = app.querySelector('[data-add-ret]');
  if(addRet) addRet.onclick = async ()=>{
    const id = addRet.dataset.addRet;
    const qty = Number(document.getElementById('ret-qty-'+id).value);
    const reason = document.getElementById('ret-reason-'+id).value.trim();
    const typeEl = document.getElementById('ret-type-'+id);
    const type = typeEl ? typeEl.value : 'gudang';
    if(!qty||qty<=0){ showToast('Isi qty.'); return; }
    if(type==='closing'){
      const item = state.items.find(it=>it.id===id);
      const sisa = item ? returanTotals(item).sisa : 0;
      if(qty > sisa){ showToast(`Qty closingan melebihi sisa retur gudang: ${sisa}`); return; }
    }
    try{
      state.items = await api(`/items/${id}/returan`, {method:'POST', body: JSON.stringify({qty, reason, type})});
      render();
    }catch(e){ showToast(e.message); }
  };

  app.querySelectorAll('[data-del-item]').forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      const id = btn.dataset.delItem;
      if(!confirm('Hapus SPK ini? Semua data (\u5099\u6599, \u9818\u6599, \u9000\u6599) akan ikut terhapus.')) return;
      try{
        state.items = await api(`/items/${id}`, {method:'DELETE'});
        state.expanded = null;
        render();
        showToast('SPK berhasil dihapus.');
      }catch(err){ showToast(err.message); }
    };
  });

  const confirmRet = app.querySelector('[data-confirm-ret]');
  if(confirmRet) confirmRet.onclick = async ()=>{
    const retId = confirmRet.dataset.confirmRet;
    try{
      state.items = await api(`/returan/${retId}/confirm`, {method:'POST'});
      render();
    }catch(e){ showToast(e.message); }
  };
}

function delBulkRow(tr){
  tr.remove();
  document.querySelectorAll('#bulkTbody tr').forEach((r,i)=>{ const n=r.querySelector('.col-no'); if(n) n.textContent=i+1; });
}

(async function init(){
  try{
    ROLE_INFO = await api('/roles');
  }catch(e){
    console.error('Gagal memuat konfigurasi akun:', e);
  }
  if(state.role && state.role!=='VIEW' && (!ROLE_INFO[state.role]||(state.role==='PRODUKSI'&&!state.building))){
    state.role=null; state.token=null; state.building=null;
    localStorage.removeItem('gudang_role'); localStorage.removeItem('gudang_token');
    localStorage.removeItem('gudang_building');
  }
  if(state.role){
    await loadItems();
  } else {
    state.loading = false;
  }
  render();
})();
</script>
</body>
</html>
